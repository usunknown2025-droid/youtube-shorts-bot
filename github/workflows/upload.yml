# YouTube Upload Workflow
name: Upload Short to YouTube

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Supabase row ID'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string
      custom_title:
        description: 'Custom Title (optional)'
        required: false
        default: ''
        type: string
      custom_description:
        description: 'Custom Description (optional)'
        required: false
        default: ''
        type: string
      custom_tags:
        description: 'Custom Tags (optional, comma-separated)'
        required: false
        default: ''
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Upload to YouTube
        run: python3 upload.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          CUSTOM_TITLE: ${{ github.event.inputs.custom_title }}
          CUSTOM_DESCRIPTION: ${{ github.event.inputs.custom_description }}
          CUSTOM_TAGS: ${{ github.event.inputs.custom_tags }}
