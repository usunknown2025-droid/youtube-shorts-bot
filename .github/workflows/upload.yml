name: Upload Short to YouTube

on:
  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string
      chat_id:
        required: true
        type: string
      title:
        required: true
        type: string
      description:
        required: false
        default: ''
        type: string
      tags:
        required: false
        default: ''
        type: string
      schedule_time:
        required: false
        default: ''
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Upload Script
        run: python3 upload.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_ID: ${{ github.event.inputs.file_id }}
          TITLE: ${{ github.event.inputs.title }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          TAGS: ${{ github.event.inputs.tags }}
          SCHEDULE_TIME: ${{ github.event.inputs.schedule_time }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
