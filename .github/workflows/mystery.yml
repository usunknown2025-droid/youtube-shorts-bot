name: Mystery Shorts Generator

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string
      category:
        description: 'Mystery category'
        required: true
        default: 'mystery'
        type: string
      voice_name:
        description: 'Voice Name'
        required: true
        default: 'en-US-ChristopherNeural'
        type: string
      duration:
        description: 'Duration in seconds'
        required: true
        default: '45'
        type: string
      num_shorts:
        description: 'Number of Shorts (1-5)'
        required: true
        default: '3'
        type: string

jobs:
  mystery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass9

      - name: Install AI dependencies
        run: pip install requests gtts edge-tts

      - name: Generate Mystery Shorts
        run: python3 mystery_process.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOICE_NAME: ${{ github.event.inputs.voice_name }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DURATION: ${{ github.event.inputs.duration }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          CATEGORY: ${{ github.event.inputs.category }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mystery-shorts
          path: mystery_short_*.mp4
          retention-days: 1
