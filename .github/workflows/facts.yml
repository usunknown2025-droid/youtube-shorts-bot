name: Facts Generator

on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
        type: string
      category:
        required: true
        default: 'space'
        type: string
      custom_category:
        required: false
        default: ''
        type: string
      num_facts:
        required: true
        default: '5'
        type: string
      voice_name:
        required: false
        default: 'hi-IN-SwaraNeural'
        type: string

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Hindi Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libass9 fonts-indic fonts-noto
      - run: pip install requests edge-tts
      - run: python3 facts_process.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CATEGORY: ${{ github.event.inputs.category }}
          CUSTOM_CATEGORY: ${{ github.event.inputs.custom_category }}
          NUM_FACTS: ${{ github.event.inputs.num_facts }}
          VOICE_NAME: ${{ github.event.inputs.voice_name }}
          VOICE_NAME: ${{ github.event.inputs.voice_name }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
