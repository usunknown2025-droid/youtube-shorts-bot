name: YouTube Video Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string
      duration:
        description: 'Duration in seconds'
        required: true
        default: '45'
        type: string
      voice_name:
        description: 'Voice Name'
        required: true
        default: 'en-US-DavisNeural'
        type: string
      num_shorts:
        description: 'Number of Shorts (1-5)'
        required: true
        default: '3'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass9

      - name: Install yt-dlp (nightly)
        run: pip install --upgrade --pre yt-dlp

      - name: Install AI dependencies
        run: pip install faster-whisper requests gtts

      - name: Create cookies file
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video
        run: |
          yt-dlp --js-runtimes deno \
            --remote-components ejs:github \
            --cookies cookies.txt \
            -f "bestvideo[height<=1080]+bestaudio/best[height<=1080]" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: Extract Audio
        run: ffmpeg -i video.mp4 -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

      - name: Transcribe with Whisper (English, word timestamps)
        run: |
          python3 -c "
          import json
          from faster_whisper import WhisperModel
          model = WhisperModel('tiny', device='cpu', compute_type='int8')
          segments, _ = model.transcribe('audio.wav', task='translate', word_timestamps=True)
          lines = []
          seg_data = []
          total_words = 0
          for s in segments:
              lines.append(f'{s.start:.1f}-{s.end:.1f}: {s.text}')
              seg_words = []
              if s.words:
                  for w in s.words:
                      seg_words.append({'start': w.start, 'end': w.end, 'word': w.word})
                      total_words += 1
              seg_data.append({'start': s.start, 'end': s.end, 'text': s.text, 'words': seg_words})
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          with open('segments.json', 'w', encoding='utf-8') as f:
              json.dump(seg_data, f)
          print('Transcript ready with ' + str(total_words) + ' words')
          "

      - name: Find Multiple Viral Moments with Groq
        run: |
          python3 -c "
          import json, os, requests, re, time
          with open('transcript.txt', encoding='utf-8') as f:
              transcript = f.read()
          api_key = os.environ['GROQ_API_KEY']
          duration = int('${{ github.event.inputs.duration }}')
          num_shorts = int('${{ github.event.inputs.num_shorts }}')
          prompt = f'''You are a viral Shorts editor. Below is a timestamped transcript of a YouTube video.

          Your task: Find the {num_shorts} BEST viral-worthy segments, each about {duration} seconds long.
          Each segment must be UNIQUE and NON-OVERLAPPING with other segments.
          Focus on moments where the speaker says something surprising, emotional, controversial, funny, or highly engaging.

          Reply ONLY in JSON format, nothing else: {{\"moments\": [{{\"start\": <start_seconds>, \"end\": <end_seconds>, \"reason\": \"<why viral>\"}}, ...]}}

          Transcript:
          {transcript}'''

          url = 'https://api.groq.com/openai/v1/chat/completions'
          headers = {'Authorization': 'Bearer ' + api_key, 'Content-Type': 'application/json'}
          payload = {
              'model': 'llama-3.1-8b-instant',
              'messages': [{'role': 'user', 'content': prompt}],
              'temperature': 0.3,
              'max_tokens': 2000
          }

          success = False
          for attempt in range(3):
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=60)
                  print('Attempt ' + str(attempt+1) + ', Status: ' + str(r.status_code))
                  result = r.json()
                  if 'choices' in result:
                      text = result['choices'][0]['message']['content']
                      match = re.search(r'\{[\s\S]*\"moments\"[\s\S]*\}', text)
                      if match:
                          data = json.loads(match.group())
                          moments = data.get('moments', [])
                          with open('moments.json', 'w') as f:
                              json.dump(moments, f)
                          print('Got ' + str(len(moments)) + ' moments')
                          success = True
                          break
                  else:
                      print('Response: ' + str(result))
                      time.sleep(5)
              except Exception as e:
                  print('Error: ' + str(e))
                  time.sleep(5)

          if not success:
              print('Groq failed - Fallback used')
              with open('moments.json', 'w') as f:
                  json.dump([{'start': 0, 'end': duration, 'reason': 'fallback'}], f)
          "
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Generate Multiple Shorts
        run: |
          cat > multi_gen.py << 'PYEOF'
          import json, os, requests, subprocess, time, re
          from gtts import gTTS

          with open('moments.json') as f:
              moments = json.load(f)

          with open('segments.json', encoding='utf-8') as f:
              all_segs = json.load(f)

          api_key = os.environ['GROQ_API_KEY']
          voice_name = os.environ.get('VOICE_NAME', 'en-US-DavisNeural')
          chat_id = os.environ.get('CHAT_ID', '')
          bot_token = os.environ.get('BOT_TOKEN', '')

          def format_time(seconds):
              hrs = int(seconds // 3600)
              mins = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              ms = int((seconds - int(seconds)) * 1000)
              return '%02d:%02d:%02d,%03d' % (hrs, mins, secs, ms)

          def gen_commentary(moment_text):
              prompt = 'Here is a transcript of a video segment. Write a short, engaging English commentary/script (max 40 words) that can be used as a voiceover for this Short. Make it exciting and hook the viewer. Only reply with the English text, nothing else.\n\nTranscript: ' + moment_text
              url = 'https://api.groq.com/openai/v1/chat/completions'
              headers = {'Authorization': 'Bearer ' + api_key, 'Content-Type': 'application/json'}
              payload = {
                  'model': 'llama-3.1-8b-instant',
                  'messages': [{'role': 'user', 'content': prompt}],
                  'temperature': 0.7,
                  'max_tokens': 200
              }
              for attempt in range(3):
                  try:
                      r = requests.post(url, headers=headers, json=payload, timeout=60)
                      result = r.json()
                      if 'choices' in result:
                          return result['choices'][0]['message']['content'].strip()
                  except Exception as e:
                      print('Groq error: ' + str(e))
                      time.sleep(3)
              return 'Check out this amazing moment!'

          def gen_tts(text, path):
              for attempt in range(3):
                  try:
                      tts = gTTS(text=text, lang='en', slow=False)
                      tts.save(path)
                      if os.path.exists(path) and os.path.getsize(path) > 1000:
                          return True
                  except Exception as e:
                      print('TTS error: ' + str(e))
                      time.sleep(3)
              return False

          def build_srt(start, end):
              srt_lines = []
              idx = 1
              for seg in all_segs:
                  if seg['end'] < start or seg['start'] > end:
                      continue
                  words = seg.get('words', [])
                  if not words:
                      continue
                  growing = []
                  for i, w in enumerate(words):
                      growing.append(w['word'].strip())
                      s = max(w['start'] - start, 0)
                      if i + 1 < len(words):
                          e = words[i + 1]['start'] - start
                      else:
                          e = w['end'] - start
                      if e <= s:
                          e = s + 0.3
                      text = ' '.join(growing)
                      srt_lines.append(str(idx) + '\n' + format_time(s) + ' --> ' + format_time(e) + '\n' + text + '\n')
                      idx += 1
              return '\n'.join(srt_lines)

          for idx, moment in enumerate(moments):
              print(f'\n========== SHORT {idx+1}/{len(moments)} ==========')
              start = float(moment['start'])
              end = float(moment['end'])
              duration = end - start

              moment_text = ' '.join([s['text'] for s in all_segs if s['start'] >= start and s['end'] <= end])

              print('Generating commentary...')
              commentary = gen_commentary(moment_text)
              commentary = re.sub(r'["\'\n\r]', ' ', commentary).strip()[:300]
              if not commentary:
                  commentary = 'Check out this amazing moment!'
              print('Commentary: ' + commentary)

              tts_path = f'tts_{idx}.mp3'
              srt_path = f'subs_{idx}.srt'
              out_path = f'shorts_{idx}.mp4'

              print('Generating TTS...')
              if not gen_tts(commentary, tts_path):
                  print('TTS failed - creating silence')
                  subprocess.run(['ffmpeg', '-f', 'lavfi', '-i', 'anullsrc=r=44100:cl=stereo', '-t', '30', '-q:a', '9', '-acodec', 'libmp3lame', tts_path])

              print('Building SRT...')
              srt_content = build_srt(start, end)
              with open(srt_path, 'w', encoding='utf-8') as f:
                  f.write(srt_content)

              print('Rendering Short...')
              subprocess.run([
                  'ffmpeg', '-y', '-ss', str(start), '-t', str(duration),
                  '-i', 'video.mp4', '-i', tts_path,
                  '-filter_complex',
                  f"[0:v]crop=ih*9/16:ih,scale=1080:1920:flags=lanczos,subtitles={srt_path}:force_style='FontName=Arial,FontSize=18,PrimaryColour=&H00FFFF&,OutlineColour=&H000000&,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=50'[v];[0:a]volume=0.2[bg];[1:a]volume=1.0[tts];[bg][tts]amix=inputs=2:duration=first[aout]",
                  '-map', '[v]', '-map', '[aout]',
                  '-c:v', 'libx264', '-preset', 'slow', '-crf', '18',
                  '-c:a', 'aac', '-b:a', '192k',
                  out_path
              ])

              print(f'Sending Short {idx+1} to Telegram...')
              subprocess.run([
                  'curl', '-s', '-X', 'POST',
                  f'https://api.telegram.org/bot{bot_token}/sendVideo',
                  '-F', f'chat_id={chat_id}',
                  '-F', f'video=@{out_path}',
                  '-F', f'caption=✅ Short {idx+1}/{len(moments)}: {moment.get("reason", "")[:100]} 🎬'
              ])
              time.sleep(3)

          print('\nAll shorts generated and sent!')
          PYEOF
          python3 multi_gen.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOICE_NAME: ${{ github.event.inputs.voice_name }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiple-shorts
          path: |
            video.mp4
            shorts_*.mp4
          retention-days: 1
