name: YouTube Video Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp (nightly)
        run: pip install --upgrade --pre yt-dlp

      - name: Install AI dependencies
        run: pip install faster-whisper requests

      - name: Create cookies file
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video
        run: |
          yt-dlp --js-runtimes deno \
            --remote-components ejs:github \
            --cookies cookies.txt \
            -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: Extract Audio
        run: ffmpeg -i video.mp4 -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

      - name: Transcribe with Whisper
        run: |
          python3 -c "
          from faster_whisper import WhisperModel
          model = WhisperModel('tiny', device='cpu', compute_type='int8')
          segments, _ = model.transcribe('audio.wav', task='translate')
          lines = []
          for s in segments:
              lines.append(f'{s.start:.1f}-{s.end:.1f}: {s.text}')
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          print('Transcript ready')
          "

      - name: Find Viral Moment with Gemini
        run: |
          python3 -c "
          import json, os, requests, re, time
          with open('transcript.txt', encoding='utf-8') as f:
              transcript = f.read()
          api_key = os.environ['GEMINI_API_KEY']
          prompt = f'''You are a viral Shorts editor. Below is a timestamped transcript of a YouTube video.
          
          Your task: Find the SINGLE most interesting, emotional, funny, shocking, or viral-worthy 45-second segment.
          Focus on moments where the speaker says something surprising, emotional, controversial, or highly engaging.
          Do NOT just pick the first 45 seconds. Look for the PEAK moment.
          
          Reply ONLY in JSON format, nothing else: {{\"start\": <start_seconds>, \"end\": <end_seconds>, \"reason\": \"<why this is viral>\"}}
          
          Transcript:
          {transcript}'''
          
          models = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-flash-latest']
          success = False
          
          for model_name in models:
              for attempt in range(3):
                  try:
                      url = f'https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={api_key}'
                      payload = {'contents': [{'parts': [{'text': prompt}]}]}
                      r = requests.post(url, json=payload, timeout=60)
                      print(f'Model: {model_name}, Attempt: {attempt+1}, Status: {r.status_code}')
                      result = r.json()
                      
                      if 'candidates' in result:
                          text = result['candidates'][0]['content']['parts'][0]['text']
                          match = re.search(r'\{[^{}]*\}', text, re.DOTALL)
                          if match:
                              moment = json.loads(match.group())
                              with open('moment.json', 'w') as f:
                                  json.dump(moment, f)
                              print(f'Viral moment: {moment}')
                              success = True
                              break
                      else:
                          print(f'Response: {result}')
                          time.sleep(5)
                  except Exception as e:
                      print(f'Error: {e}')
                      time.sleep(5)
              
              if success:
                  break
          
          if not success:
              print('All models failed - Fallback used')
              with open('moment.json', 'w') as f:
                  json.dump({'start': 0, 'end': 45, 'reason': 'fallback'}, f)
          "
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Cut Viral Segment in 9:16
        run: |
          START=$(python3 -c "import json; print(json.load(open('moment.json'))['start'])")
          END=$(python3 -c "import json; print(json.load(open('moment.json'))['end'])")
          DURATION=$(python3 -c "import json; m=json.load(open('moment.json')); print(float(m['end']) - float(m['start']))")
          ffmpeg -i video.mp4 -ss $START -t $DURATION \
            -vf "crop=ih*9/16:ih,scale=1080:1920" \
            -c:v libx264 -crf 23 -c:a aac \
            shorts.mp4

      - name: Send Video to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F "chat_id=${{ github.event.inputs.chat_id }}" \
            -F "video=@shorts.mp4" \
            -F "caption=✅ Here is your viral Short! 🎬"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: |
            video.mp4
            shorts.mp4
          retention-days: 1
