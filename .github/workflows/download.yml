name: YouTube Video Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string
      duration:
        description: 'Duration in seconds'
        required: true
        default: '45'
        type: string
      voice_name:
        description: 'Voice Name'
        required: true
        default: 'en-US-DavisNeural'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass9

      - name: Install yt-dlp (nightly)
        run: pip install --upgrade --pre yt-dlp

      - name: Install AI dependencies
        run: pip install faster-whisper requests edge-tts

      - name: Create cookies file
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video
        run: |
          yt-dlp --js-runtimes deno \
            --remote-components ejs:github \
            --cookies cookies.txt \
            -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: Extract Audio
        run: ffmpeg -i video.mp4 -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

      - name: Transcribe with Whisper (English)
        run: |
          python3 -c "
          import json
          from faster_whisper import WhisperModel
          model = WhisperModel('tiny', device='cpu', compute_type='int8')
          segments, _ = model.transcribe('audio.wav', task='translate')
          lines = []
          seg_data = []
          for s in segments:
              lines.append(f'{s.start:.1f}-{s.end:.1f}: {s.text}')
              seg_data.append({'start': s.start, 'end': s.end, 'text': s.text})
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          with open('segments.json', 'w', encoding='utf-8') as f:
              json.dump(seg_data, f)
          print('Transcript ready')
          "

      - name: Find Viral Moment with Gemini
        run: |
          python3 -c "
          import json, os, requests, re, time
          with open('transcript.txt', encoding='utf-8') as f:
              transcript = f.read()
          api_key = os.environ['GEMINI_API_KEY']
          duration = int('${{ github.event.inputs.duration }}')
          prompt = f'''You are a viral Shorts editor. Below is a timestamped transcript of a YouTube video.
          
          Your task: Find the SINGLE most interesting, emotional, funny, shocking, or viral-worthy segment of about {duration} seconds.
          Focus on moments where the speaker says something surprising, emotional, controversial, or highly engaging.
          Do NOT just pick the first {duration} seconds. Look for the PEAK moment.
          
          Reply ONLY in JSON format, nothing else: {{\"start\": <start_seconds>, \"end\": <end_seconds>, \"reason\": \"<why this is viral>\"}}
          
          Transcript:
          {transcript}'''
          
          models = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-flash-latest']
          success = False
          
          for model_name in models:
              for attempt in range(3):
                  try:
                      url = f'https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={api_key}'
                      payload = {'contents': [{'parts': [{'text': prompt}]}]}
                      r = requests.post(url, json=payload, timeout=60)
                      print(f'Model: {model_name}, Attempt: {attempt+1}, Status: {r.status_code}')
                      result = r.json()
                      
                      if 'candidates' in result:
                          text = result['candidates'][0]['content']['parts'][0]['text']
                          match = re.search(r'\{[^{}]*\}', text, re.DOTALL)
                          if match:
                              moment = json.loads(match.group())
                              with open('moment.json', 'w') as f:
                                  json.dump(moment, f)
                              print(f'Viral moment: {moment}')
                              success = True
                              break
                      else:
                          print(f'Response: {result}')
                          time.sleep(5)
                  except Exception as e:
                      print(f'Error: {e}')
                      time.sleep(5)
              
              if success:
                  break
          
          if not success:
              print('All models failed - Fallback used')
              with open('moment.json', 'w') as f:
                  json.dump({'start': 0, 'end': duration, 'reason': 'fallback'}, f)
          "
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate English Commentary and TTS
        run: |
          python3 -c "
          import json, os, requests, subprocess, time, re as _re
          
          with open('moment.json') as f:
              moment = json.load(f)
          start = float(moment['start'])
          end = float(moment['end'])
          
          with open('segments.json', encoding='utf-8') as f:
              segments = json.load(f)
              
          moment_text = ' '.join([s['text'] for s in segments if s['start'] >= start and s['end'] <= end])
          
          api_key = os.environ['GEMINI_API_KEY']
          prompt = f'''Here is a transcript of a video segment. Write a short, engaging English commentary/script (max 40 words) that can be used as a voiceover for this Short. Make it exciting and hook the viewer. Only reply with the English text, nothing else.
          
          Transcript: {moment_text}'''
          
          models = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-flash-latest']
          commentary = None
          
          for model_name in models:
              try:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={api_key}'
                  r = requests.post(url, json={'contents': [{'parts': [{'text': prompt}]}]}, timeout=60)
                  result = r.json()
                  if 'candidates' in result:
                      commentary = result['candidates'][0]['content']['parts'][0]['text'].strip()
                      print(f'Commentary from {model_name}: {commentary}')
                      break
              except Exception as e:
                  print(f'Error with {model_name}: {e}')
                  time.sleep(3)
          
          if not commentary:
              commentary = 'Check out this amazing moment!'
              print(f'Fallback commentary: {commentary}')
          
          # Clean commentary
          commentary = _re.sub(r'[\"\'\\n\\r]', ' ', commentary)
          commentary = commentary.strip()[:300]
          if not commentary:
              commentary = 'Check out this amazing moment!'
          
          # Write to file
          with open('commentary.txt', 'w', encoding='utf-8') as f:
              f.write(commentary)
          print(f'Commentary file created: {commentary}')
          
          # Generate TTS with retry
          tts_ok = False
          for attempt in range(3):
              try:
                  result = subprocess.run(
                      ['edge-tts', '--voice', '${{ github.event.inputs.voice_name }}',
                       '--file', 'commentary.txt', '--write-media', 'tts.mp3'],
                      capture_output=True, text=True, timeout=60
                  )
                  print(f'TTS attempt {attempt+1} stderr: {result.stderr[:500]}')
                  if os.path.exists('tts.mp3') and os.path.getsize('tts.mp3') > 1000:
                      tts_ok = True
                      print(f'TTS ready ({os.path.getsize(\"tts.mp3\")} bytes)')
                      break
              except Exception as e:
                  print(f'TTS error: {e}')
                  time.sleep(3)
          
          if not tts_ok:
              print('TTS failed, creating silence instead')
              subprocess.run(['ffmpeg', '-f', 'lavfi', '-i', 'anullsrc=r=44100:cl=stereo',
                              '-t', '30', '-q:a', '9', '-acodec', 'libmp3lame', 'tts.mp3'])
          
          # Generate SRT
          def format_time(seconds):
              hrs = int(seconds // 3600)
              mins = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              ms = int((seconds - int(seconds)) * 1000)
              return f'{hrs:02d}:{mins:02d}:{secs:02d},{ms:03d}'
              
          srt_lines = []
          idx = 1
          for seg in segments:
              if seg['start'] >= start and seg['end'] <= end:
                  s = seg['start'] - start
                  e = seg['end'] - start
                  srt_lines.append(f'{idx}\\n{format_time(s)} --> {format_time(e)}\\n{seg[\"text\"]}\\n')
                  idx += 1
          with open('subs.srt', 'w', encoding='utf-8') as f:
              f.write('\\n'.join(srt_lines))
          print('SRT ready')
          "
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Cut, Mix Audio, and Burn Captions
        run: |
          START=$(python3 -c "import json; print(json.load(open('moment.json'))['start'])")
          DURATION=${{ github.event.inputs.duration }}
          
          ffmpeg -ss $START -t $DURATION -i video.mp4 -i tts.mp3 \
            -filter_complex "[0:v]crop=ih*9/16:ih,scale=1080:1920,subtitles=subs.srt:force_style='FontName=Arial,FontSize=18,PrimaryColour=&H00FFFF&,OutlineColour=&H000000&,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=50'[v];[0:a]volume=0.2[bg];[1:a]volume=1.0[tts];[bg][tts]amix=inputs=2:duration=first[aout]" \
            -map "[v]" -map "[aout]" -c:v libx264 -crf 23 -c:a aac shorts.mp4

      - name: Send Video to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F "chat_id=${{ github.event.inputs.chat_id }}" \
            -F "video=@shorts.mp4" \
            -F "caption=✅ Here is your viral Short! 🎬 Voice: ${{ github.event.inputs.voice_name }} | Duration: ${{ github.event.inputs.duration }}s"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: |
            video.mp4
            shorts.mp4
          retention-days: 1
