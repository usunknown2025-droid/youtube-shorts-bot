name: YouTube Video Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Create cookies file
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download Video
        run: |
          yt-dlp --js-runtimes node \
            --remote-components ejs:github \
            --cookies cookies.txt \
            -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: Create 9:16 Short Clip
        run: |
          ffmpeg -i video.mp4 -t 30 \
            -vf "crop=ih*9/16:ih,scale=1080:1920" \
            -c:v libx264 -crf 23 -c:a aac \
            shorts.mp4

      - name: Send Video to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F "chat_id=${{ github.event.inputs.chat_id }}" \
            -F "video=@shorts.mp4" \
            -F "caption=✅ Yeh raha tumhara 9:16 Short! Ab main ise process karta hoon."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: |
            video.mp4
            shorts.mp4
          retention-days: 1
