const staticData = $getWorkflowStaticData('global');
const chatId = $('Telegram Trigger').item.json.message.chat.id;
const userText = ($('Telegram Trigger').item.json.message.text || '').trim();
const rowId = staticData['schedule_row_' + chatId];

// Parse "DD/MM/YY HH:MM AM/PM"
const regex = /(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i;
const match = userText.match(regex);

if (!match) {
  return [{
    json: {
      error: 'invalid_format',
      chat_id: chatId,
      row_id: rowId,
      message: 'Format galat hai. Sahi format: DD/MM/YY HH:MM AM/PM'
    }
  }];
}

const day = parseInt(match[1], 10);
const month = parseInt(match[2], 10) - 1;
let year = parseInt(match[3], 10);
if (year < 100) year += 2000;

const inputHour = parseInt(match[4], 10);
const minute = parseInt(match[5], 10);
const ampm = match[6].toUpperCase();

// 24-hour conversion
let hour24 = inputHour;
if (ampm === 'PM' && inputHour < 12) hour24 = inputHour + 12;
if (ampm === 'AM' && inputHour === 12) hour24 = 0;

// USA Eastern Time (EDT Mar-Nov, EST rest)
let offsetHours = -5;
if (month >= 2 && month <= 10) {
  offsetHours = -4;
}

const utcMillis = Date.UTC(year, month, day, hour24, minute) - (offsetHours * 60 * 60 * 1000);
const utcDate = new Date(utcMillis);
const scheduledForUtc = utcDate.toISOString();

// Display
const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const scheduledForEst = `${monthNames[month]} ${String(day).padStart(2,'0')}, ${year}, ${String(inputHour).padStart(2,'0')}:${String(minute).padStart(2,'0')} ${ampm}`;

// Clear state
delete staticData['schedule_state_' + chatId];
delete staticData['schedule_row_' + chatId];

return [{
  json: {
    success: true,
    row_id: rowId,
    chat_id: chatId,
    scheduled_for_utc: scheduledForUtc,
    scheduled_for_est: scheduledForEst
  }
}];
